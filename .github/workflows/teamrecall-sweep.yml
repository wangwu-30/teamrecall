name: teamrecall-sweep

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: teamrecall-sweep-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TEAMRECALL_REF: v0.3.0

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install teamrecall
        run: |
          if [ "${{ github.repository }}" = "wangwu-30/teamrecall" ]; then
            npm ci
            npm run build
            echo "TEAMRECALL_BIN=node ${GITHUB_WORKSPACE}/dist/cli.js" >> "$GITHUB_ENV"
          else
            echo "TEAMRECALL_BIN=npx -y github:wangwu-30/teamrecall#${TEAMRECALL_REF}" >> "$GITHUB_ENV"
          fi

      - name: Sweep stale memories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: $TEAMRECALL_BIN sweep --pr
