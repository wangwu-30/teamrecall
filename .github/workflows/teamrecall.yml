name: teamrecall

on:
  pull_request:
    types: [closed]

concurrency:
  group: teamrecall-learn-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TEAMRECALL_REF: v0.2.0

jobs:
  learn:
    # Merged PRs always. Closed-unmerged PRs only when comments already exist;
    # `learn --ci` then skips unless at least one comment is from a human.
    if: >
      github.event.pull_request.merged == true ||
      github.event.pull_request.comments > 0 ||
      github.event.pull_request.review_comments > 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install teamrecall
        run: |
          if [ "${{ github.repository }}" = "wangwu-30/teamrecall" ]; then
            npm ci
            npm run build
            echo "TEAMRECALL_BIN=node ${GITHUB_WORKSPACE}/dist/cli.js" >> "$GITHUB_ENV"
          else
            echo "TEAMRECALL_BIN=npx -y github:wangwu-30/teamrecall#${TEAMRECALL_REF}" >> "$GITHUB_ENV"
          fi

      - name: Learn from closed PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: $TEAMRECALL_BIN learn ${{ github.event.pull_request.number }} --ci
