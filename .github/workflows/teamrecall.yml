name: teamrecall

on:
  pull_request:
    types: [closed]

concurrency:
  group: teamrecall-learn-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TEAMRECALL_REF: v0.3.0

jobs:
  decide:
    # Always run on closed PRs. GitHub's comments / review_comments counts
    # miss review-summary-only reviews; decide checks reviews via REST and
    # skips the install/learn job when the thread is empty or bot-only.
    runs-on: ubuntu-latest
    outputs:
      learn: ${{ steps.decide.outputs.learn }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "learn=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR="${{ github.event.pull_request.number }}"
          authors=$(
            {
              gh api "repos/${{ github.repository }}/issues/${PR}/comments" --jq '.[] | [.user.login, .user.type] | @tsv' || true
              gh api "repos/${{ github.repository }}/pulls/${PR}/comments" --jq '.[] | [.user.login, .user.type] | @tsv' || true
              gh api "repos/${{ github.repository }}/pulls/${PR}/reviews" --jq '.[] | select(.body != "") | [.user.login, .user.type] | @tsv' || true
            } | awk 'NF'
          )
          if [ -z "$authors" ]; then
            echo "learn=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS=$'\t' read -r login type; do
            lower=$(printf '%s' "$login" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              *'[bot]'*|*-bot|github-actions|codecov|vercel|dependabot|renovate|copilot|cursor)
                continue
                ;;
            esac
            if [ "$(printf '%s' "$type" | tr '[:upper:]' '[:lower:]')" = "bot" ]; then
              continue
            fi
            echo "learn=true" >> "$GITHUB_OUTPUT"
            exit 0
          done <<< "$authors"
          echo "learn=false" >> "$GITHUB_OUTPUT"

  learn:
    needs: decide
    if: needs.decide.outputs.learn == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install teamrecall
        run: |
          if [ "${{ github.repository }}" = "wangwu-30/teamrecall" ]; then
            npm ci
            npm run build
            echo "TEAMRECALL_BIN=node ${GITHUB_WORKSPACE}/dist/cli.js" >> "$GITHUB_ENV"
          else
            echo "TEAMRECALL_BIN=npx -y github:wangwu-30/teamrecall#${TEAMRECALL_REF}" >> "$GITHUB_ENV"
          fi

      - name: Load candidate state
        run: |
          set -euo pipefail
          mkdir -p .memory
          if git ls-remote --exit-code origin refs/heads/teamrecall/state >/dev/null 2>&1; then
            if ! git fetch origin +teamrecall/state:teamrecall/state; then
              echo "::warning::Could not fetch teamrecall/state (read-only token)"
            fi
          else
            echo "::notice::teamrecall/state does not exist yet (first run)"
          fi
          git show teamrecall/state:.memory/candidates.jsonl > .memory/candidates.jsonl 2>/dev/null || true

      - name: Learn from closed PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: $TEAMRECALL_BIN learn ${{ github.event.pull_request.number }} --ci

      - name: Persist candidate state
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f .memory/candidates.jsonl ]; then exit 0; fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::warning::Skipping teamrecall/state push for a fork PR"
            exit 0
          fi
          INCOMING=/tmp/teamrecall-incoming.jsonl
          REMOTE=/tmp/teamrecall-remote.jsonl
          MERGED=/tmp/teamrecall-merged.jsonl
          DEF="${{ github.event.repository.default_branch }}"
          cp .memory/candidates.jsonl "$INCOMING"
          merge_remote() {
            if git ls-remote --exit-code origin refs/heads/teamrecall/state >/dev/null 2>&1; then
              if ! git fetch origin +teamrecall/state:teamrecall/state; then
                echo "::warning::Could not fetch teamrecall/state (read-only token)"
              fi
            else
              echo "::notice::teamrecall/state does not exist yet (first run)"
            fi
            git show teamrecall/state:.memory/candidates.jsonl > "$REMOTE" 2>/dev/null || : > "$REMOTE"
            $TEAMRECALL_BIN merge-candidates "$INCOMING" "$REMOTE" --out "$MERGED"
          }
          push_state() {
            if git rev-parse --verify teamrecall/state >/dev/null 2>&1; then
              git checkout --force teamrecall/state
            else
              git checkout --orphan teamrecall/state
              git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
            fi
            mkdir -p .memory
            cp "$MERGED" .memory/candidates.jsonl
            git add .memory/candidates.jsonl
            if git diff --cached --quiet; then
              git checkout --force "$DEF" || true
              return 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "teamrecall: update review candidates"
            if git push origin teamrecall/state; then
              git checkout --force "$DEF" || true
              return 0
            fi
            echo "::warning::git push teamrecall/state failed (conflict or read-only token)"
            git checkout --force "$DEF" || true
            return 1
          }
          for _attempt in 1 2 3; do
            merge_remote
            if push_state; then exit 0; fi
          done
          echo "::warning::Could not update teamrecall/state after retries (read-only token or push conflict). Candidates were not persisted."
          exit 0
